[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mi_bici"
version = "0.0.1"
description = "MLOps de MiBici proyecto de equipo"
authors = [
  { name = "TC5061-Equipo11" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = "~=3.13.0"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "mlflow>=2.16",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "requests>=2.32",
    "python-dotenv",
    "loguru",
    "tqdm",
    "typer",
]

[project.optional-dependencies]
dev = [
    "jupyterlab",
    "ipykernel",
    "nbstripout",
    "pytest",
    "ruff",
    "mkdocs",
    "locust>=2.30",
]

[tool.ruff]
line-length = 99
src = ["mi_bici"]
include = ["pyproject.toml", "mi_bici/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mi_bici"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "single"