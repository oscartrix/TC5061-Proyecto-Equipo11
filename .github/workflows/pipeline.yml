name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1'

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_TRACKING_URI: http://127.0.0.1:5000

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt -r requirements-test.txt
          pip install -e . --no-deps

      - name: Pruebas
        run: python -m pytest -q tests

      - name: Seguridad
        run: make security

      - name: Buscar credenciales en el repositorio
        run: |
          if git grep -nEi '(password|passwd|secret|api[_-]?key|aws_access_key_id)[[:space:]]*[=:][[:space:]]*["'"'"'][^"'"'"']+["'"'"']' -- '*.py' '*.yml' '*.yaml' '*.json' ':!requirements*'; then
            echo 'Posible credencial en el repositorio'
            exit 1
          fi

  pipeline:
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt -r requirements-test.txt
          pip install -e . --no-deps

      - name: Revisar que no se versionen datos ni artefactos de MLflow
        run: |
          if git ls-files | grep -E 'mlflow\.db|mlruns/|mlartifacts/|\.parquet$|\.pkl$|\.joblib$|data/raw/.+\.csv$'; then
            echo 'Hay archivos que no deben estar en el repositorio'
            exit 1
          fi

      - name: Servidor de tracking
        run: |
          nohup mlflow server --backend-store-uri sqlite:///mlflow.db --host 127.0.0.1 --port 5000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf $MLFLOW_TRACKING_URI/health && exit 0
            sleep 2
          done
          cat server.log
          exit 1

      - name: Cache de los CSV de MiBici
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('config/sources.yaml') }}

      - name: Ingesta y características
        run: mlflow run . -e main --experiment-name mibici-equipo11 --env-manager local

      - name: Validación de datos con DeepChecks
        run: make validate

      - name: Guardar reportes de validación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-validacion
          path: |
            reports/data_quality
            reports/data_drift

      - name: Baselines y candidatos
        run: make train-all ENV_MANAGER=local

      - name: Búsquedas con nested runs
        run: |
          mlflow run . -e search -P question=p1 -P model=ridge --experiment-name mibici-equipo11 --env-manager local
          mlflow run . -e search -P question=p3 -P model=kmeans_usage --experiment-name mibici-equipo11 --env-manager local

      - name: Model Registry
        run: |
          for q in p1 p2 p3; do
            mlflow run . -e register -P question=$q --experiment-name mibici-equipo11 --env-manager local
          done

      - name: Evaluación de calidad contra baselines
        run: |
          for q in p1 p2 p3; do
            mlflow run . -e evaluate -P question="$q" \
              --experiment-name mibici-equipo11 --env-manager local
          done

      - name: Guardar reportes de evaluación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-evaluacion
          path: reports/evaluation

      - name: Inferencia con los modelos champion
        run: |
          for q in p1 p2 p3; do
            features_path="data/processed/${q}_features.parquet"
            if [ "$q" = p3 ]; then
              features_path="data/processed/p3_holdout_features.parquet"
            fi
            mlflow run . -e predict -P question="$q" \
              -P features_path="$features_path" \
              -P predictions_path="data/processed/${q}_predictions.parquet" \
              --experiment-name mibici-equipo11 --env-manager local
          done

      - name: Exportar el champion de P1
        run: python scripts/export_model.py --question p1 --output models/p1_champion

      - name: Construir la imagen de la API
        run: docker build -f Containerfile -t mibici-api .

      - name: Levantar el contenedor
        run: |
          docker run -d --name mibici-api -p 8000:8000 mibici-api
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs mibici-api
          exit 1

      - name: Probar la API del contenedor
        run: |
          row='{"lag_1d":12.0,"lag_7d":11.0,"lag_14d":3.0,"lag_21d":4.0,"rolling_mean_7d":11.857143,"capacity":19,"day_of_week":2,"month":9,"is_weekend":0,"is_holiday":0,"zone":"ZPN"}'
          code=$(curl -s -o respuesta.json -w '%{http_code}' -X POST http://127.0.0.1:8000/p1/predict \
            -H 'Content-Type: application/json' -d "{\"instances\":[$row]}")
          cat respuesta.json
          [ "$code" = 200 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/p1/predict \
            -H 'Content-Type: application/json' -d '{"instances":[{"month":13}]}')
          [ "$code" = 422 ]

      - name: Guardar la respuesta de la API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respuesta-api
          path: respuesta.json
