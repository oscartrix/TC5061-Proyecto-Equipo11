services:
  # Servidor MLflow Tracking Server & Artifact Store (definido en Dockerfile)
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mibici-equipo11
    restart: unless-stopped
    # Se usa 5001 porque hay conflictos con macOS
    ports:
      - "5001:5000"
    environment:
      - MLFLOW_TRACKING_URI=http://0.0.0.0:5000
    volumes:
      - mlflow-db:/app/db
      - mlflow-artifacts:/app/mlartifacts
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:5000/')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mibici-net

  # API REST de Inferencia FastApi/Uvicorn (definida en Containerfile)
  api:
    # Se descarga de GHCR; si no está disponible se construye con el Containerfile
    image: ghcr.io/oscartrix/mibici-api:latest
    build:
      context: .
      dockerfile: Containerfile
    container_name: mibici-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Si se incluye el modelo pre-exportado en la imagen:
      - MODEL_PATH=/app/models/p1_champion
      # onnx (ONNX Runtime) o sklearn; los dos modelos vienen en la imagen
      - INFERENCE_BACKEND=${INFERENCE_BACKEND:-onnx}
      # En caso de requerir conexión al registry de MLflow si se omite MODEL_PATH:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_NAME=mibici-equipo11-p1-demanda
      - MODEL_ALIAS=champion
      - REDIS_URL=redis://redis:6379
    # Recursos de la instancia de referencia; se cambian con API_CPUS y API_MEMORY
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-1}"
          memory: ${API_MEMORY:-1g}
    depends_on:
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mibici-net

  # Cola de predicciones por lote (POST /p1/predict-async)
  redis:
    image: redis:7.4-alpine
    container_name: mibici-redis
    restart: unless-stopped
    # Sin persistencia: los resultados duran una hora y se pueden volver a pedir
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "100mb"]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - mibici-net

  # Worker de RQ: misma imagen de la API, procesa los lotes encolados
  worker:
    image: ghcr.io/oscartrix/mibici-api:latest
    container_name: mibici-worker
    restart: unless-stopped
    # SimpleWorker no crea un proceso por trabajo y carga el modelo una sola vez
    command: ["rq", "worker", "predicciones", "--url", "redis://redis:6379", "--worker-class", "rq.worker.SimpleWorker"]
    environment:
      - MODEL_PATH=/app/models/p1_champion
      - INFERENCE_BACKEND=${INFERENCE_BACKEND:-onnx}
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-0.5}"
          memory: ${WORKER_MEMORY:-512m}
    # El healthcheck de la imagen revisa el puerto 8000; el worker se revisa en Redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from redis import Redis; from rq import Worker; import sys; sys.exit(0 if Worker.all(connection=Redis.from_url('redis://redis:6379')) else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - mibici-net

volumes:
  mlflow-db:
    name: mibici_equipo11_db
  mlflow-artifacts:
    name: mibici_equipo11_artifacts

networks:
  mibici-net:
    name: mibici_network
    driver: bridge
